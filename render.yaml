# Blueprint de Render del HR Assistant (spec/04-production.md, punto 7).
# El servicio se llama igual que el repositorio para no actualizar por error otro
# servicio que ya exista en la cuenta.
services:
  - type: web
    name: Fabric-AI-M4
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Publica solo cuando el pipeline de CI (style, unit, e2e, docker) pasa.
    autoDeployTrigger: checksPass
    envVars:
      # Con production el producto revisa las reglas de compliance al arrancar.
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      # Secretos: Render pide su valor al crear el Blueprint; nunca van en el repositorio.
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      # LANGSMITH_API_KEY es opcional: se agrega en Render > Environment solo si se
      # encienden las trazas (LANGSMITH_TRACING=true).
