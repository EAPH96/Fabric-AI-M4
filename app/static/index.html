<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f4f5f7;
      color: #1f2933;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px;
    }
    .subtitle {
      margin: 0 0 16px;
      color: #52606d;
    }
    #conversation {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 200px;
      padding: 16px;
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .message {
      padding: 10px 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #e3f2fd;
    }
    .message.assistant {
      align-self: flex-start;
      background: #f0f4f8;
    }
    .message.error {
      align-self: stretch;
      background: #fdecea;
      color: #8a1c1c;
    }
    .tools {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #52606d;
    }
    .request-id {
      margin-top: 4px;
      font-size: 0.75rem;
      font-family: ui-monospace, monospace;
      color: #7b8794;
    }
    .api-key {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .api-key input {
      flex: 1;
      padding: 8px;
      font: inherit;
      border: 1px solid #bcccdc;
      border-radius: 6px;
    }
    form {
      display: flex;
      gap: 8px;
    }
    textarea {
      flex: 1;
      min-height: 48px;
      padding: 8px;
      font: inherit;
      border: 1px solid #bcccdc;
      border-radius: 6px;
      resize: vertical;
    }
    button {
      padding: 0 20px;
      font: inherit;
      color: #ffffff;
      background: #2f6fde;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background: #9fb3c8;
      cursor: wait;
    }
  </style>
</head>
<body>
  <main>
    <h1>HR Assistant</h1>
    <p class="subtitle">
      Pregunta por un empleado (por ejemplo EMP-0004) o por un departamento.
    </p>
    <!-- La clave solo vive en sessionStorage de esta pestaña: se borra al
         cerrarla y nunca se escribe en esta página. -->
    <div class="api-key">
      <label for="api-key">Clave de acceso</label>
      <input id="api-key" data-testid="api-key" type="password"
        autocomplete="off" spellcheck="false"
        placeholder="Escribe la clave que te dio el equipo de RH">
    </div>
    <div id="conversation" data-testid="answer" aria-live="polite"></div>
    <form id="ask-form">
      <label for="question" hidden>Pregunta</label>
      <!-- Sin "required": la validación del navegador ocultaría el mensaje
           en español que muestra el script ante una pregunta vacía. -->
      <textarea id="question" data-testid="question"
        placeholder="Escribe tu pregunta"></textarea>
      <button type="submit" id="send" data-testid="send">Enviar</button>
    </form>
    <!-- Molde de la línea con el id de la petición; se clona por respuesta. -->
    <template id="request-id-template">
      <div class="request-id" data-testid="request-id"></div>
    </template>
  </main>
  <script>
    (function () {
      "use strict";

      // El historial vive solo en el navegador; la API no guarda nada.
      const history = [];
      const form = document.getElementById("ask-form");
      const input = document.getElementById("question");
      const sendButton = document.getElementById("send");
      const conversation = document.getElementById("conversation");
      const requestIdTemplate = document.getElementById("request-id-template");
      const apiKeyInput = document.getElementById("api-key");
      // Llave fija de sessionStorage: la clave se borra al cerrar la pestaña.
      const API_KEY_STORAGE = "hr-assistant-api-key";

      // Lee la clave del campo y la guarda solo para esta sesión.
      function currentApiKey() {
        const apiKey = apiKeyInput.value.trim();
        try {
          if (apiKey) {
            window.sessionStorage.setItem(API_KEY_STORAGE, apiKey);
          } else {
            window.sessionStorage.removeItem(API_KEY_STORAGE);
          }
        } catch (error) {
          // Sin sessionStorage (modo privado estricto) la clave sigue en el campo.
        }
        return apiKey;
      }

      // Recupera la clave de la sesión si la pestaña se recargó.
      try {
        apiKeyInput.value = window.sessionStorage.getItem(API_KEY_STORAGE) || "";
      } catch (error) {
        apiKeyInput.value = "";
      }
      apiKeyInput.addEventListener("input", currentApiKey);

      // Agrega un mensaje a la conversación. Siempre con textContent.
      // requestId es el id de la petición, para que la persona lo pase a soporte.
      function addMessage(kind, text, tools, requestId) {
        const item = document.createElement("div");
        item.className = "message " + kind;
        const body = document.createElement("div");
        body.textContent = text;
        item.appendChild(body);
        if (Array.isArray(tools)) {
          const toolsLine = document.createElement("div");
          toolsLine.className = "tools";
          toolsLine.textContent = tools.length
            ? "Herramientas usadas: " + tools.join(", ")
            : "Herramientas usadas: ninguna";
          item.appendChild(toolsLine);
        }
        if (requestId) {
          const idLine = requestIdTemplate.content.firstElementChild
            .cloneNode(true);
          idLine.textContent = "Id de la petición: " + requestId;
          item.appendChild(idLine);
        }
        conversation.appendChild(item);
        item.scrollIntoView({ block: "end" });
      }

      // Mensaje del 429 con los segundos de Retry-After.
      function rateLimitMessage(retryAfter) {
        const seconds = parseInt(retryAfter, 10);
        if (!(seconds > 0)) {
          return "Demasiadas preguntas; espera unos segundos";
        }
        return "Demasiadas preguntas; espera " + seconds +
          (seconds === 1 ? " segundo" : " segundos");
      }

      // Traduce un código de error de la API a un mensaje en español.
      function errorMessage(response) {
        const status = response.status;
        if (status === 401) {
          return "Clave inválida. Revisa la clave e intenta de nuevo.";
        }
        if (status === 429) {
          return rateLimitMessage(response.headers.get("Retry-After"));
        }
        if (status === 422) {
          return "La pregunta no es válida: no puede estar vacía ni ser " +
            "demasiado larga.";
        }
        return "El servidor respondió con un error (código " + status +
          "). Intenta de nuevo más tarde.";
      }

      async function ask(question, apiKey) {
        const payload = { question: question, history: history.slice() };
        let response;
        try {
          response = await fetch("/ask", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-API-Key": apiKey
            },
            body: JSON.stringify(payload)
          });
        } catch (error) {
          addMessage("error", "No se pudo conectar con el servidor. " +
            "Revisa tu conexión e intenta de nuevo.");
          return;
        }
        // En errores el id llega en el encabezado; en respuestas, en el cuerpo.
        const headerId = response.headers.get("X-Request-ID");
        if (!response.ok) {
          addMessage("error", errorMessage(response), null, headerId);
          return;
        }
        let data;
        try {
          data = await response.json();
        } catch (error) {
          addMessage("error", "La respuesta del servidor no se pudo leer.",
            null, headerId);
          return;
        }
        history.push({ role: "user", content: question });
        history.push({ role: "assistant", content: data.answer });
        addMessage("assistant", data.answer, data.tools_used,
          data.request_id || headerId);
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const question = input.value.trim();
        if (!question) {
          addMessage("error", "Escribe una pregunta antes de enviar.");
          return;
        }
        const apiKey = currentApiKey();
        if (!apiKey) {
          addMessage("error", "Escribe tu clave de acceso antes de preguntar.");
          apiKeyInput.focus();
          return;
        }
        addMessage("user", question);
        input.value = "";
        sendButton.disabled = true;
        try {
          await ask(question, apiKey);
        } finally {
          sendButton.disabled = false;
          input.focus();
        }
      });

      // Enter envía; Shift+Enter agrega una línea.
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });
    })();
  </script>
</body>
</html>
